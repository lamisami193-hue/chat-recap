<title>Page not found | TG Wrapped</title>
<meta name="theme-color" content="#0b0f1a">
<style>
:root{--bg:#0b0f1a;--panel:#141a2b;--text:#eef1ff;--muted:#9aa3c7;--a1:#7c5cff;--a2:#ff5c8a;--r:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Sans",Arial,sans-serif;line-height:1.65}
body{min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;max-width:820px;width:100%;margin:0 auto}
.brand{font-weight:800;letter-spacing:.3px;font-size:20px;text-decoration:none;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.back{color:var(--muted);font-size:14px;text-decoration:none}
.back:hover,.back:focus-visible{color:var(--text);text-decoration:underline}
main{flex:1;width:100%;max-width:820px;margin:0 auto;padding:8px 16px 40px}
h1{font-size:clamp(28px,5vw,40px);line-height:1.15;margin:18px 0 6px}
h2{font-size:20px;margin:28px 0 8px}
p,li{color:#cfd5f2}
.upd{color:var(--muted);font-size:14px;margin:0 0 18px}
.panel{background:var(--panel);border-radius:var(--r);padding:14px 18px;margin:16px 0;border:1px solid rgba(61,220,151,.35)}
.panel p{margin:0}
a{color:#b9a8ff}
ul{padding-inline-start:22px}
footer{max-width:820px;width:100%;margin:0 auto;padding:18px 16px 28px;color:var(--muted);font-size:13px;text-align:center}
footer a{color:var(--muted);margin:0 8px}
.big{font-size:clamp(72px,18vw,140px);font-weight:900;line-height:1;margin:24px 0 0;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}.langs{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}.langs a{background:var(--panel);padding:8px 16px;border-radius:999px;text-decoration:none}</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/">TG Wrapped</a>
</header>
<main>
<p class="big">404</p>
<h1>Page not found</h1>
<p>This page does not exist or was moved. You can go back to the tool, or open it in your language:</p>
<div class="langs">
<a href="/">English</a><a href="/ar/">العربية</a><a href="/es/">Español</a><a href="/fr/">Français</a><a href="/pt/">Português</a>
</div>
<p><a href="/guides/">Guides</a> &middot; <a href="/about/">About</a> &middot; <a href="/privacy/">Privacy</a> &middot; <a href="/terms/">Terms</a></p>
</main>
</body>
</html>
